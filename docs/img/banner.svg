<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="cis_bridge: One API for every FiveM framework. cisoko.net">
  <style>
    .glow { animation: breathe 6s ease-in-out infinite; }
    .arc { animation: pulse 4s ease-in-out infinite; stroke-opacity: 0; }
    .node { animation: pulse 4s ease-in-out infinite .25s; opacity: .45; }
    .shine { animation: shine 4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 20% { stroke-opacity: 0; opacity: .45; } 40% { stroke-opacity: 1; opacity: 1; } 70%, 100% { stroke-opacity: 0; opacity: .45; } }
    @keyframes shine { 0%, 30% { transform: translateX(-700px); } 75%, 100% { transform: translateX(700px); } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .arc, .node, .shine { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="g" cx="25%" cy="50%" r="75%">
      <stop offset="0" stop-color="#D8A83E" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#D8A83E" stop-opacity=".05"/>
      <stop offset="1" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="t">
      <text x="422" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="1">One API for every FiveM framework</text>
    </clipPath>
  </defs>
  <rect width="1200" height="300" rx="10" fill="#090909"/>
  <rect class="glow" width="1200" height="300" rx="10" fill="url(#g)"/>
  <g fill="none" stroke="#D8A83E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(285 162) scale(.88)">
    <line x1="-88" y1="22" x2="88" y2="22"/>
    <path d="M-74 22c0-42 33-70 74-70s74 28 74 70"/>
    <line x1="-44" y1="-30" x2="-44" y2="22"/>
    <line x1="0" y1="-48" x2="0" y2="22"/>
    <line x1="44" y1="-30" x2="44" y2="22"/>
    <path class="arc" d="M-74 22c0-42 33-70 74-70s74 28 74 70" stroke="#FFE3A3" stroke-width="6.5"/>
    <circle class="node" cx="-74" cy="22" r="7" fill="#FFE3A3" stroke="none"/>
    <circle class="node" cx="0" cy="-48" r="7" fill="#FFE3A3" stroke="none"/>
    <circle class="node" cx="74" cy="22" r="7" fill="#FFE3A3" stroke="none"/>
  </g>
  <text x="420" y="152" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F2F6FC" letter-spacing="-1">cis_bridge</text>
  <text x="422" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#D8A83E" letter-spacing="1">One API for every FiveM framework</text>
  <g clip-path="url(#t)">
    <rect class="shine" x="422" y="170" width="260" height="40" fill="url(#s)"/>
  </g>
  <text x="1170" y="276" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8A8F98" letter-spacing="1">cisoko.net</text>
</svg>
